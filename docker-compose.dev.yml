services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: app_migrator
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: ecommerce
    # Host port 5433 avoids conflict with any other local Postgres on 5432.
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_migrator -d ecommerce"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    # Host port 6380 avoids conflict with any other local Redis on 6379.
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
