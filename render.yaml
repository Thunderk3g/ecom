# Render Blueprint — STOPGAP JOBS HOST (worker + scheduler only).
#
# Deployment topology after the Supabase/Vercel pivot (see SUPABASE-MIGRATION.md):
#   - web (Next.js SSR/admin/API) ........ Vercel        (see vercel.json)
#   - Postgres ........................... Supabase      (DATABASE_URL / APP_DATABASE_URL)
#   - Redis (cache + BullMQ) ............. Upstash       (REDIS_URL)
#   - worker + scheduler (this file) ..... Render        <-- BullMQ consumer + cron enqueuer
#
# This host exists because Vercel is serverless and cannot run the long-lived
# `worker`/`scheduler` processes. It runs the SAME Docker image as web, with the
# ROLE env var selecting the entrypoint (docker/entrypoint.sh). It is a stopgap
# until Phase 4 moves jobs onto Supabase pg_cron + Edge Functions, at which point
# this blueprint (and Redis) is retired.
#
# DATABASE_URL / APP_DATABASE_URL / REDIS_URL are NO LONGER wired from managed
# Render resources — they point at Supabase + Upstash and live in the
# `ecommerce-secrets` env group (created once in the Render dashboard, shared by
# both services). Never commit the values.

services:
  # --- worker: BullMQ consumer (emails, csv.imports, inventory.alerts,
  #     search.reindex, webhook.dispatch, image.post-process) -------------------
  - type: worker
    name: ecommerce-worker
    runtime: docker
    repo: https://github.com/Thunderk3g/ecom
    branch: main
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: true
    envVars:
      - key: ROLE
        value: worker
      - fromGroup: ecommerce-secrets

  # --- scheduler: cron-like enqueuer (reservation.ttl.sweep, cart.ttl.sweep,
  #     orders.stale-payment-sweep, webhook.dispatch) ---------------------------
  - type: worker
    name: ecommerce-scheduler
    runtime: docker
    repo: https://github.com/Thunderk3g/ecom
    branch: main
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: true
    envVars:
      - key: ROLE
        value: scheduler
      - fromGroup: ecommerce-secrets

# Secrets shared across both services. Create the group in the Render dashboard
# and populate values there (never commit secrets). Listed here for documentation.
#
# Connection strings (point at Supabase + Upstash — NOT managed Render resources):
#   DATABASE_URL      Supabase SESSION pooler :5432 as postgres.<ref>   (migrator)
#   APP_DATABASE_URL  Supabase TXN pooler     :6543 as app_user.<ref>   (runtime, NOBYPASSRLS)
#   REDIS_URL         Upstash rediss:// URL                              (BullMQ)
# Both DATABASE_URL and APP_DATABASE_URL are required: src/db/client.ts constructs
# the migrator and runtime clients at module load, so the worker/scheduler won't
# boot with either missing.
envVarGroups:
  - name: ecommerce-secrets
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: METRICS_TOKEN
        sync: false
      - key: RATE_LIMIT_PER_MIN
        value: "120"
      - key: SENTRY_DSN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MEDIA_PROVIDER
        value: stub
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: IMGPROXY_BASE_URL
        sync: false
      - key: IMGPROXY_KEY
        sync: false
      - key: IMGPROXY_SALT
        sync: false
