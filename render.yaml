# Render Blueprint — one Docker image, three runtime roles, plus managed
# Postgres and Redis. The ROLE env var selects the entrypoint behaviour
# (web | worker | scheduler) per docker/entrypoint.sh.
#
# Secrets (DATABASE_URL/REDIS_URL are wired from the managed resources below;
# everything else lives in the `ecommerce-secrets` env group, created once in
# the Render dashboard and shared by all three services). See docs/runbook.md.

databases:
  - name: ecommerce-postgres
    plan: free # bump to standard for connection headroom + 7-day+ PITR backups
    databaseName: ecommerce
    user: app_migrator
    postgresMajorVersion: "15"

services:
  # --- Redis (cache + BullMQ) -------------------------------------------------
  - type: redis
    name: ecommerce-redis
    plan: free
    maxmemoryPolicy: noeviction # BullMQ requires keys not be evicted
    ipAllowList: [] # private network only

  # --- web: Next.js SSR/ISR + admin + /api/v1 --------------------------------
  - type: web
    name: ecommerce-web
    runtime: image
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    image:
      url: ghcr.io/OWNER/ecommerce:latest # set by CI on push to main
    envVars:
      - key: ROLE
        value: web
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ecommerce-redis
          property: connectionString
      - fromGroup: ecommerce-secrets

  # --- worker: BullMQ consumer ------------------------------------------------
  - type: worker
    name: ecommerce-worker
    runtime: image
    plan: starter
    autoDeploy: true
    image:
      url: ghcr.io/OWNER/ecommerce:latest
    envVars:
      - key: ROLE
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ecommerce-redis
          property: connectionString
      - fromGroup: ecommerce-secrets

  # --- scheduler: cron-like enqueuer -----------------------------------------
  - type: worker
    name: ecommerce-scheduler
    runtime: image
    plan: starter
    autoDeploy: true
    image:
      url: ghcr.io/OWNER/ecommerce:latest
    envVars:
      - key: ROLE
        value: scheduler
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ecommerce-redis
          property: connectionString
      - fromGroup: ecommerce-secrets

# Secrets shared across services. Create the group in the Render dashboard and
# populate values there (never commit secrets). Listed here for documentation.
envVarGroups:
  - name: ecommerce-secrets
    envVars:
      - key: SESSION_SECRET
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: METRICS_TOKEN
        sync: false
      - key: RATE_LIMIT_PER_MIN
        value: "120"
      - key: SENTRY_DSN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MEDIA_PROVIDER
        value: r2-imgproxy
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: IMGPROXY_BASE_URL
        sync: false
      - key: IMGPROXY_KEY
        sync: false
      - key: IMGPROXY_SALT
        sync: false
